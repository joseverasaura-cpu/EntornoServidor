{% extends "home.html" %}
{% block main %}
    <h1>Tres en raya</h1>
<p>{{ mensaje }}</p>
<div id="3EnRaya">
    {% if not terminado %}
        <form action="{% url 'enraya:homepage' %}" method="post" style="display: grid; grid-template-columns: repeat(3, 1fr);gap: 8px; max-width: 300px; ">
            {% csrf_token %}
            <input type="hidden" name="tablero" value="{{ tablero }}">
            <input type="hidden" name="turno" value="{{ turno }}">
            {% for casilla in tablero %}                    
                <button type="submit" name="posicion" value="{{ forloop.counter0 }}" style="width: 100%; aspect-ratio: 1 / 1;">
                    {{ casilla }}
                </button>
            {% endfor %}
        </form>
    {% endif %}
    <form action="{% url 'enraya:homepage' %}" method="get" style="margin-top: 20px;">
            <button type="submit" style="width: 100%; max-width: 300px; padding: 10px; cursor: pointer;">
                Reiniciar Juego
            </button>
        </form>
</div>
{% endblock main %}
